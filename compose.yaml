services:
  wordpress:
    build:
      context: ./docker/wordpress
    image: theobroma-wordpress:7.0.2-php8.3-apache
    restart: unless-stopped
    ports:
      - "${WORDPRESS_BIND_ADDRESS:-127.0.0.1}:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      THEOBROMA_SMTP_HOST: mailpit
      THEOBROMA_SMTP_PORT: 1025
      THEOBROMA_SMTP_ENCRYPTION: ""
      THEOBROMA_MAIL_FROM: shop@theobroma.local
      THEOBROMA_MAIL_FROM_NAME: Theobroma
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/wordpress/.htaccess:/var/www/html/.htaccess
      - ./wp-content/themes/theobroma:/var/www/html/wp-content/themes/theobroma
      - ./wp-content/plugins/theobroma-admin-tools:/var/www/html/wp-content/plugins/theobroma-admin-tools
      - ./wp-content/plugins/theobroma-analytics:/var/www/html/wp-content/plugins/theobroma-analytics
      - ./wp-content/plugins/theobroma-commerce:/var/www/html/wp-content/plugins/theobroma-commerce
      - ./wp-content/plugins/theobroma-seo:/var/www/html/wp-content/plugins/theobroma-seo
      - ./scripts:/opt/theobroma-scripts:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  wordpress_data:
  db_data:
